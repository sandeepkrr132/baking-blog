<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sweet Crumbs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .login-page {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }
        .login-card {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 3rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .login-card h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: var(--color-text-light);
            margin-bottom: 2rem;
        }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.875rem 2rem;
            border: 2px solid var(--color-border);
            background: var(--color-white);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .google-btn:hover {
            background: var(--color-bg-alt);
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .google-btn svg {
            width: 20px;
            height: 20px;
        }
        .login-error {
            background: #FEE2E2;
            color: #DC2626;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--color-text-light);
            font-size: 0.875rem;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }
        .guest-link {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .guest-link:hover {
            text-decoration: underline;
        }
        .auth-form {
            display: none;
            text-align: left;
        }
        .auth-form.active {
            display: block;
        }
        .auth-form label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.375rem;
            font-size: 0.9rem;
            color: var(--color-text);
        }
        .auth-form input[type="text"],
        .auth-form input[type="email"],
        .auth-form input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: var(--font-body);
            color: var(--color-text);
            background: var(--color-bg);
            transition: border-color 0.2s;
            margin-bottom: 1rem;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .auth-submit-btn {
            width: 100%;
            padding: 0.875rem 2rem;
            background: var(--color-primary);
            color: var(--color-white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .auth-submit-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .auth-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .auth-toggle {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--color-text-light);
            text-align: center;
        }
        .auth-toggle a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .auth-toggle a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon">🧁</span>
                    <span class="logo-text">Sweet Crumbs</span>
                </a>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="index.html#recipes" class="nav-link">Recipes</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="login-page">
        <div class="login-card">
            <h1>Welcome Back</h1>
            <p>Sign in to save your favorite recipes</p>

            <div class="login-error" id="loginError"></div>

            <button class="google-btn" id="googleLoginBtn" onclick="signInWithGoogle()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>

            <div class="login-divider">or</div>

            <form class="auth-form active" id="authForm" onsubmit="handleEmailAuth(event)">
                <div id="nameField" style="display:none;">
                    <label for="authName">Name</label>
                    <input type="text" id="authName" placeholder="Your name" autocomplete="name">
                </div>
                <label for="authEmail">Email</label>
                <input type="email" id="authEmail" placeholder="you@example.com" required autocomplete="email">
                <label for="authPassword">Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required minlength="6" autocomplete="current-password">
                <div id="authConfirmField" style="display:none;">
                    <label for="authConfirm">Confirm Password</label>
                    <input type="password" id="authConfirm" placeholder="••••••••" minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="auth-submit-btn" id="authSubmitBtn">Sign In</button>
            </form>

            <div class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <a id="authToggleLink" onclick="toggleAuthMode()">Create one</a>
            </div>

            <div class="login-divider">or</div>

            <a href="index.html" class="guest-link">Continue as guest</a>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Sweet Crumbs Baking Blog. Happy Baking! 🍪</p>
        </div>
    </footer>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script>
        let isSignUp = false;

        // If already logged in, redirect to home
        checkSession().then(user => {
            if (user) window.location.href = 'index.html';
        });

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            const toggleText = document.getElementById('authToggleText');
            const toggleLink = document.getElementById('authToggleLink');
            const submitBtn = document.getElementById('authSubmitBtn');
            const nameField = document.getElementById('nameField');
            const confirmField = document.getElementById('authConfirmField');
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            if (isSignUp) {
                toggleText.textContent = 'Already have an account?';
                toggleLink.textContent = 'Sign in';
                submitBtn.textContent = 'Create Account';
                nameField.style.display = 'block';
                confirmField.style.display = 'block';
            } else {
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Create one';
                submitBtn.textContent = 'Sign In';
                nameField.style.display = 'none';
                confirmField.style.display = 'none';
            }
        }

        async function handleEmailAuth(e) {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            const submitBtn = document.getElementById('authSubmitBtn');
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            errorEl.style.display = 'none';

            if (isSignUp) {
                const confirm = document.getElementById('authConfirm').value;
                if (password !== confirm) {
                    errorEl.textContent = 'Passwords do not match.';
                    errorEl.style.display = 'block';
                    return;
                }
            }

            submitBtn.disabled = true;
            submitBtn.textContent = isSignUp ? 'Creating account...' : 'Signing in...';

            try {
                if (isSignUp) {
                    const name = document.getElementById('authName').value.trim();
                    await emailSignUp(email, password, name);
                } else {
                    await emailSignIn(email, password);
                }
                window.location.href = 'index.html';
            } catch (err) {
                console.error('Auth error:', err);
                errorEl.textContent = friendlyError(err.message || 'Authentication failed. Please try again.');
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
            }
        }

        function friendlyError(msg) {
            if (msg.includes('already registered') || msg.includes('already been registered')) return 'An account with this email already exists.';
            if (msg.includes('Invalid login credentials')) return 'Invalid email or password.';
            if (msg.includes('Password should')) return 'Password must be at least 6 characters.';
            if (msg.includes('Unable to validate')) return 'Please enter a valid email address.';
            return msg;
        }

        async function signInWithGoogle() {
            const btn = document.getElementById('googleLoginBtn');
            const errorEl = document.getElementById('loginError');
            btn.disabled = true;
            btn.textContent = 'Redirecting...';
            errorEl.style.display = 'none';

            try {
                await signInWithGoogleProvider();
            } catch (err) {
                console.error('Login error:', err);
                errorEl.textContent = err.message || 'Failed to sign in. Please try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign in with Google`;
            }
        }
    </script>
</body>
</html>
